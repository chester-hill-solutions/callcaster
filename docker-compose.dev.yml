# Local dev stack (Phase 0 scaffold). Object storage uses `stow` — a
# Docker-free S3-compatible dev bucket service — not a container: the
# postgres/inbucket images below are the only compose services. Stow is
# started by the setup/e2e harness scripts (scripts/e2e/start-stow.mjs).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   export DATABASE_URL=postgresql://callcaster:callcaster@127.0.0.1:5433/callcaster
#   # After squashed baseline lands:
#   # drizzle-kit push   # or migrate against drizzle/

services:
  postgres:
    image: postgres:18-alpine
    container_name: callcaster-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: callcaster
      POSTGRES_PASSWORD: callcaster
      POSTGRES_DB: callcaster
    volumes:
      # Mount at /var/lib/postgresql, NOT .../data. From 18 the official images
      # store data in a major-version subdirectory (/var/lib/postgresql/18/docker)
      # so pg_upgrade --link works across a single mount point. They also refuse
      # to boot when a mount is present at the old .../data path — even an empty
      # one — so the legacy mount fails on a fresh volume, not just an upgrade.
      # See docker-library/postgres#1259.
      - callcaster_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callcaster -d callcaster"]
      interval: 5s
      timeout: 5s
      retries: 5

  inbucket:
    image: inbucket/inbucket:latest
    container_name: callcaster-inbucket
    ports:
      - "9002:9000"
      - "2500:2500"

volumes:
  callcaster_pgdata:
