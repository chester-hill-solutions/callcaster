name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      # Agent metadata does not affect the application or CI runtime.
      - AGENTS.md
      - .agents/**
      - .opencode/**
      - .gitignore
  pull_request:
    paths-ignore:
      # Keep workflow, dependency, and runtime configuration changes in CI.
      - AGENTS.md
      - .agents/**
      - .opencode/**
      - .gitignore
  # Nightly full-signal run (the coverage job only runs here now — per-PR
  # coverage duplicated both test suites on every push for marginal signal).
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

# packages:read lets GITHUB_TOKEN fetch @chester-hill-solutions/* from GitHub
# Packages when the workflow token is permitted. Prefer repository secret
# NODE_AUTH_TOKEN (PAT with read:packages) if org package access fails.
permissions:
  contents: read
  packages: read

# Superseded runs die instead of queueing: on a PR, a new push cancels the
# previous run for the same ref. Scheduled/dispatch runs (and pushes to the
# default branch, which ride deploys) never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path scoping for the jobs that can be safely skipped (see
  # scripts/lib/ci-changes-lib.mjs, unit-tested in test/ci-changes.test.ts).
  # An unresolvable base degrades to "run everything" inside the script.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Three-dot merge-base diff needs real history.
          fetch-depth: 0
      - name: Resolve changed-file scope
        id: changes
        run: node scripts/ci-changes.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      # Release PRs (into master) must ship their changelog: entries dated,
      # Unreleased left empty. Docs-only PRs pass; PRs into dev are not gated.
      - name: Release changelog gate
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: node scripts/check-changelog.mjs --base "${{ github.event.pull_request.base.sha }}"

  quality:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # test:node shells out to `bun test`, and the media-stream service tests
      # spawn `bun run services/media-stream/index.ts`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      # The app resolves @chester-hill-solutions/scriptkit-* to vendor/ via a
      # node_modules symlink, and those packages' "main" points at their
      # committed dist/. Nothing else builds them, so a src/ edit without a
      # rebuild silently ships stale code. Build here; the `git diff
      # --exit-code` at the end of this job then fails on a stale dist/.
      - run: npm run vendor:build
      # npm (package-lock.json) and bun (bun.lock, Railway Docker build) must
      # move together — a dep added with npm alone fails the Railway image
      # build minutes after push, far from the cause.
      - run: npm run check:bun-lock
      - run: npm run typecheck
      - run: npm run lint
      # Strictness rules (complexity, depth, function size, console, cycles,
      # non-null assertions) as a ratchet: growth over the baseline fails.
      - run: npm run check:lint-ratchet
      - run: npm run test:node
        env:
          # The bun-test step imports server/bun.ts, which eagerly constructs
          # the parent Twilio client at module scope. Tests never hit Twilio.
          TWILIO_SID: AC_ci_test_placeholder
          TWILIO_AUTH_TOKEN: ci_test_placeholder
      - run: npm run test:ui
      - run: npm run tools:routes:verify
      - run: npm run tools:api:surface:check
      - run: npm run check:route-server-leaks
      - run: npm run check:twilio-webhooks
      - run: npm run check:request-body-consumption
      - run: npm run check:middleware
      - run: npm run check:credit-writes
      # requireDualAuth admits API keys, which carry no user — so
      # requireWorkspaceAccess cannot check them. One route was declared
      # session-only and authed dual, leaving key callers entirely unguarded.
      - run: npm run check:dual-auth
      # Security gates. These previously ran ONLY in `ci:local`, so a regression
      # in workspace write authorization, or a loader leaking twilio_data /
      # stripe_id to the client, could merge unnoticed.
      - run: npm run check:route-authz
      # Companion to the above: route-authz asks whether a workspaces+ WRITE
      # enforces a ROLE. This asks whether ANY tenant-data route proves
      # MEMBERSHIP — the question the api+ surface was never asked, and where
      # three cross-tenant IDORs lived. Follows imports into the specific
      # service functions a route calls, because this codebase checks there.
      - run: npm run check:route-membership
      - run: npm run check:workspace-projection
      - run: npm run check:effects
      - run: npm run check:type-safety
      # A relative `redirect("../…")` in a loader/action resolves against
      # `request.url` per RFC 3986. Refactors that move a file up or down
      # the URL tree silently reroute it — the "successful upload → 404"
      # flow in #1396. Ratchet the current allowlist so no new one lands.
      - run: npm run check:relative-redirects
      # Drizzle nests the Postgres SQLSTATE on error.cause; inline
      # `.code === "23505"` checks miss it, which is how duplicate campaign
      # names shipped a generic "Unexpected Server Error" behind green CI.
      - run: npm run check:pg-errors
      - run: npm run check:dry
      - run: npm run check:handlers
      # A replacing vi.mock factory hard-codes a shared server module's export
      # surface; when the module gains an export, route tests fail with the
      # route's catch-all error and nobody connects the two. New factories
      # must spread importOriginal (ratchet baseline keeps existing ones).
      - run: npm run check:test-mocks
      - run: npm run check:db-rpcs
      # check:db-rpcs only asks whether a function EXISTS — its header says it
      # cannot see inside one. This reads the body: the queue RPCs must write
      # the campaign_queue columns QUEUE_ENTRY_TRANSITIONS says they write, and
      # must not reference the dropped `status` column that cost four separate
      # repair migrations, each found in production rather than here.
      - run: npm run check:queue-rpc-contract
      - run: npm run db:ledger:check
      # The production install path. Its drift guard sat below a DATABASE_URL
      # exit and no workflow invoked it, so a migration wired into the compose
      # list but not the fresh-DB list was green here and produced a prod schema
      # missing that migration.
      - run: npm run db:bootstrap:check
      # Enum VALUES. Every other DB gate looks at functions and tables; a value
      # added to a schema.ts pgEnum with no ADD VALUE migration was green here
      # while campaign_schedule_sync dead-lettered every minute in prod (#1476).
      - run: npm run db:enums:check
      - run: npm run db:orphans:check
      # Ratchet (#1048): fail on new >800-line app files or growth of allowlisted offenders.
      - run: npm run tools:check-file-size
      # Codegen drift. Split out of `ci:local` because it requires a clean tree,
      # which made the canonical pre-PR command unusable during the work it
      # gates. Run it yourself before pushing: `npm run ci:codegen:verify`.
      - run: npm run ci:codegen:verify

  bundle-guard:
    needs: changes
    # Only the production build + forbidden-server-string scan: pointless
    # when the client bundle cannot have changed (docs/tooling/baseline PRs).
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: npm run build
      - run: npm run check:client-bundle

  coverage:
    # Nightly + manual only: per-PR coverage re-ran both test suites with
    # instrumentation on every push. Coverage trends do not need PR latency.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The media-stream service tests spawn `bun run`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: npm run test:coverage
        env:
          COVERAGE_FULL: "0"
