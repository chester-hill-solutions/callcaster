name: Schema default drift

# The independent real-Postgres tier includes both schema drift guards (#2243)
# and application integration tests (#2211). `ci:local` and `quality` have no
# database; this job gives database failures their own result, separate from E2E.
#
# This workflow is the actual gate. It boots Postgres, applies
# `client/migrations` with the repo's own psql-free bootstrap
# (`scripts/e2e/bootstrap-compose-db.mjs`, #2227), and runs the entire tier.
# Both drift guards fail loudly rather than skipping: `SCHEMA_DEFAULT_DRIFT_UPDATE`
# is never set here, so the baseline is asserted, never rewritten.
#
# What each guard catches:
#
#   schema-type-drift     a column declared text() where the database has a
#                         timestamp, or a baselined column that stopped lying
#   schema-default-drift  a column the database defaults that the model does not
#                         declare, or an exemption that is no longer needed
#
# A stale baseline line fails in both, on purpose: it would let the next
# regression on that column match it and pass.
#
# Needs no secrets. The database is ephemeral and local to the runner.
# Keep events free of file filters. Server-only and test-only changes need this
# signal, and a filtered-out workflow cannot report a required check result.

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-default-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

      # A service container rather than the repo's compose file: no port to pick
      # and no health-wait loop to get wrong. `supercharge/postgres-service` is a
      # wrapper around `services:` and resolves unreliably, so this is the plain
      # form the runner provides.
      - name: Start Postgres
        run: |
          docker run -d --name drift-postgres \
            -e POSTGRES_DB=callcaster \
            -e POSTGRES_USER=callcaster \
            -e POSTGRES_PASSWORD=callcaster \
            -p 5436:5432 \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:18-alpine

          for attempt in $(seq 1 30); do
            if docker exec drift-postgres pg_isready -U callcaster -d callcaster; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done

          echo "postgres did not become ready" >&2
          docker logs drift-postgres >&2
          exit 1

      # The repo's own bootstrap, not `drizzle-kit push` and not an `psql -f`
      # loop (#2227 removed the psql dependency from the e2e path for exactly
      # this reason). Applying client/migrations is what makes the guards
      # meaningful: an unapplied migration would make them compare against a
      # stale database.
      - name: Bootstrap the database
        env:
          DATABASE_URL: postgres://callcaster:callcaster@127.0.0.1:5436/callcaster
        run: node scripts/e2e/bootstrap-compose-db.mjs

      # Leave failures visible on this job; do not suppress its exit status.
      - name: Real-Postgres integration tier
        env:
          DATABASE_URL: postgres://callcaster:callcaster@127.0.0.1:5436/callcaster
        run: npm run test:integration-db
