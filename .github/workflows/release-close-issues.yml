name: Release closes its issues

# #1956: a `dev → master` release PR must use a closing keyword so GitHub
# closes the promoted issues when the release merges. Release bodies list
# issues as bare `(#1816)` mentions, which GitHub does NOT treat as closing
# references — so shipped issues stayed open forever and the board kept
# re-auditing them in its "Verify and close" lane.
#
# GitHub only closes an issue from `Closes #N` when the pull request merges
# into the default branch (`master`), which is exactly the release PR. This
# gate requires at least one closing reference in a release PR body, with the
# existing `no-issue` label override for a genuinely issue-free release.
#
# GitHub closes ONE issue per closing keyword. It does not read a comma
# separated list behind a single keyword, and it does not read a bare number
# in that list either.
#
# Release PR #2668 (dev → master, merged 2026-10-16) ended with
#
#   Closes #2655, #2663, #2634, #2605, #1292, #2596, #2588, #2503, #2504,
#   #2505, #2513, #2510, #2517, #2508, #1347, #2010, #2298
#
# and only #2655 closed. The issue timelines are the proof: #2655 closed at
# the merge timestamp by the merger, #2663 and #2504 were closed by hand a
# day later, and #2605, #2503, #2513 and #2510 were never closed at all even
# though their fixes are in master. An issue that stays open stays on the
# on-dev lane of the CHS backlog project, so the board keeps re-auditing
# work that already shipped.
#
# This gate used to accept that body, because its regex treated the comma
# list as a group of closing references. It was checking a shape GitHub does
# not honour. scripts/check-release-closing-references.mjs now checks the
# shape GitHub actually implements: every issue needs its own keyword.
#
# The `dev`-branch gate (`pr-issue-reference.yml`) is unchanged: dev PRs may
# reference an issue with a bare `Issues: #N` line, because a dev merge only
# marks the issue on-dev, it does not close it.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-closing-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the no-issue override label
        id: labels
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels[*].name) }}
        run: |
          if printf '%s' "$LABELS" | grep -q '"no-issue"'; then
            echo "has_override=true" >> "$GITHUB_OUTPUT"
            echo "no-issue label present; the closing reference is not required"
          else
            echo "has_override=false" >> "$GITHUB_OUTPUT"
          fi

      # The checker is a script in this repository, so the repository has to be
      # on disk. The gate used to read the body with a shell regex and needed
      # no checkout.
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Find closing references
        id: closes
        if: steps.labels.outputs.has_override != 'true'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/release-body.md"
          node scripts/check-release-closing-references.mjs "$RUNNER_TEMP/release-body.md"
          numbers=$(node scripts/check-release-closing-references.mjs --json "$RUNNER_TEMP/release-body.md" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(String(JSON.parse(s).closes.length))})')
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
          echo "Closing references: $numbers"

      - name: Fail when the release has no closing reference
        if: steps.labels.outputs.has_override != 'true' && steps.closes.outputs.numbers == '0'
        run: |
          echo "::error::A dev → master release PR must close the issues it promotes."
          echo "::error::Add a \"Closes #N\" line for the promoted issues so GitHub closes them on merge,"
          echo "::error::or label the PR 'no-issue' for a genuinely issue-free release."
          exit 1
