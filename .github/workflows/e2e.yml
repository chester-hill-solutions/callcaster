name: E2E

on:
  push:
    branches: [main, master]
  # The app server runs under Bun in production; PR-level CI otherwise never
  # boots it, so Bun-only regressions (e.g. react-dom/server export shape)
  # would only surface after merge.
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # run-compose-e2e.mjs starts the app via `bun run ./server/bun.ts`.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci
        env:
          # Vendored CHS auth packages do not need this; keep for future registry deps.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}

      # The compose bootstrap applies drizzle/ + client/migrations via psql.
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Single entry point, identical to the local gate: docker compose
      # (postgres + minio + inbucket) → schema bootstrap → seed → build →
      # bun server on :3100 → full Playwright suite.
      - name: Run compose E2E gate
        run: npm run test:e2e:compose
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            playwright-report/
            test-results/
