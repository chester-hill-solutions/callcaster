name: Issue on dev

# GitHub closes an issue from `Closes #N` only when the pull request merges
# into the default branch (`master`), which is the production promotion.
# Nothing marks the issue when its fix lands on `dev`, so the kanban cannot
# tell "fixed, waiting to be tested on dev" from "not started" (#1162).
#
# This workflow fires when a pull request merges into `dev`, reads the
# referenced issues from its body, and for each referenced issue moves the
# issue's item on the CHS backlog project to the "on-dev" Status via
# `gh project item-edit` (#1822):
#
#   * Status is the ONLY mechanism for "this fix is on dev" — the fragile
#     label no longer exists. Board tooling reads the project Status, and a
#     label cannot encode the target column.
#   * It also posts one comment naming the pull request and the merge commit.
#
# The project move needs a token that can write to organisation projects:
# GITHUB_TOKEN cannot, so the step uses the fine-grained `PROJECT_TOKEN`
# secret with Projects read/write. Without it the move is skipped (logged)
# and only the comment lands — run the `project-on-dev-status` skill to
# backfill the Status move in that case.
#
# Repository variables:
#
#   ON_DEV_PROJECT_NUMBER  — the project number from its URL (CHS backlog = 9)
#   ON_DEV_STATUS_VALUE    — the Status option to move to (default "on-dev")
#   ON_DEV_STATUS_FIELD    — the Status field name (default "Status")
#
# The Status option name is the project's own lowercase `on-dev`, NOT `On dev`.
# A stale value makes the option lookup fail and the step skip silently while
# still posting the comment (the original #1822 symptom).
#
# The release promotion keeps closing the issue on `master`, so "closed"
# still means "in production".

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  mark-on-dev:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Find issues referenced by this pull request
        id: issues
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Two conventions: GitHub closing keywords AND this repo's bare
          # `Issues: #N, #N` line (codex-sourced fixes use the latter, which
          # GitHub's auto-close regex misses). Parse both. The final sort+tr
          # must stay INSIDE the $(...) — a pipeline on the assignment forks
          # the subshell and leaves `numbers` empty.
          numbers=$(
            { printf '%s' "$BODY" \
                | grep -oiE '\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b[[:space:]]*:?[[:space:]]*#[0-9]+' \
                | grep -oE '[0-9]+$'; \
              printf '%s\n' "$BODY" \
                | grep -oiE '\bissues?\b[[:space:]]*:?[[:space:]]*#[0-9]+([[:space:],]+#?[0-9]+)*' \
                | grep -oE '#[0-9]+' | grep -oE '[0-9]+$'; } \
            | sort -un | tr '\n' ' '
          )
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
          echo "Issues: ${numbers:-none}"

      - name: Move project items to "on-dev" Status
        if: steps.issues.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PROJECT: ${{ vars.ON_DEV_PROJECT_NUMBER }}
          STATUS_FIELD: ${{ vars.ON_DEV_STATUS_FIELD || 'Status' }}
          STATUS_VALUE: ${{ vars.ON_DEV_STATUS_VALUE || 'on-dev' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          NUMBERS: ${{ steps.issues.outputs.numbers }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PROJECT_TOKEN secret not set; skipping the project move — run the project-on-dev-status skill to backfill"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PROJECT" ]; then
            echo "ON_DEV_PROJECT_NUMBER not set; skipping the project move"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fields=$(gh project field-list "$PROJECT" --owner "$OWNER" --format json)
          project_id=$(gh project view "$PROJECT" --owner "$OWNER" --format json --jq .id)
          status_field=$(printf '%s' "$fields" | jq -r --arg f "$STATUS_FIELD" \
            '.fields[] | select(.name == $f) | .id')
          option_id=$(printf '%s' "$fields" | jq -r --arg f "$STATUS_FIELD" --arg v "$STATUS_VALUE" \
            '.fields[] | select(.name == $f) | .options[] | select(.name == $v) | .id')
          if [ -z "$status_field" ] || [ -z "$option_id" ]; then
            echo "Status field '$STATUS_FIELD' or option '$STATUS_VALUE' not found on project $PROJECT; skipping"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          moved=0
          for n in $NUMBERS; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || echo "MISSING")
            if [ "$state" = "MISSING" ]; then echo "#$n: not an issue, skipping"; continue; fi
            # GraphQL is authoritative for item resolution; item-list can
            # silently drop items even when they ARE on the project.
            item_id=$(gh api graphql -f query="query { repository(owner: \"$OWNER\", name: \"$(basename "$REPO")\") { issue(number: $n) { projectItems(first: 5) { nodes { id project { number } } } } } }" \
              | jq -r --argjson proj "$PROJECT" \
                '[.data.repository.issue.projectItems.nodes[] | select(.project.number == $proj) | .id][0]')
            if [ -z "$item_id" ] || [ "$item_id" = "null" ]; then
              echo "#$n: not on project $PROJECT, skipping"
              continue
            fi
            gh project item-edit --project-id "$project_id" --id "$item_id" \
              --field-id "$status_field" --single-select-option-id "$option_id"
            moved=$((moved+1))
          done
          echo "has_token=true" >> "$GITHUB_OUTPUT"
          echo "moved=$moved"

      - name: Comment on the issues
        if: steps.issues.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          NUMBERS: ${{ steps.issues.outputs.numbers }}
        run: |
          for n in $NUMBERS; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || echo "MISSING")
            if [ "$state" = "MISSING" ]; then echo "#$n: not an issue, skipping"; continue; fi
            gh issue comment "$n" --repo "$REPO" --body "On dev: merged in $PR_URL (\`${SHA:0:8}\`). Retest on the review environment; this issue closes when the fix is promoted to master."
            echo "#$n: commented"
          done