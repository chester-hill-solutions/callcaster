name: Issue on dev

# A dev merge updates the project status. The master release closes issues.
# PROJECT_TOKEN needs repository read access and organization Projects write access.
# Never substitute labels or issue comments for a failed project update.
on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged dev pull request to sync
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  mark-on-dev:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Run trusted merged code, never the pull request's head checkout.
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move closing issues to on-dev
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.ON_DEV_PROJECT_NUMBER || '9' }}
          STATUS_VALUE: ${{ vars.ON_DEV_STATUS_VALUE || 'on-dev' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set PROJECT_TOKEN with repository read and organization Projects write access. No board status was changed."
            exit 1
          fi
          node scripts/sync-issue-project-status.mjs
